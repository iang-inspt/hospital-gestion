<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Médicos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>
    <div class="container mt-5">

        <h1>Gestión de Médicos</h1>

        <div data-th-if="${mensaje}"
             class="alert alert-success"
             data-th-text="${mensaje}">
        </div>

        <div data-th-if="${error}"
             class="alert alert-danger"
             data-th-text="${error}">
        </div>

        <a data-th-href="@{/medicos/nuevo}"
           class="btn btn-primary mb-3">
            Nuevo médico
        </a>

        <table class="table table-striped">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>DNI</th>
                    <th>Nombre</th>
                    <th>Apellido</th>
                    <th>Especialidad</th>
                    <th>Acciones</th>
                </tr>
            </thead>

            <tbody>
                <tr data-th-each="medico : ${medicos}">
                    <td data-th-text="${medico.id}"></td>
                    <td data-th-text="${medico.dni}"></td>
                    <td data-th-text="${medico.nombre}"></td>
                    <td data-th-text="${medico.apellido}"></td>
                    <td data-th-text="${medico.especialidad}"></td>

                    <td>
                        <a data-th-href="@{/medicos/editar/{id}(id=${medico.id})}"
                           class="btn btn-warning btn-sm">
                            Editar
                        </a>

                        <form data-th-action="@{/medicos/eliminar/{id}(id=${medico.id})}"
                              method="post"
                              class="d-inline"
                              onsubmit="return confirm('¿Eliminar este médico?');">

                            <button type="submit"
                                    class="btn btn-danger btn-sm">
                                Eliminar
                            </button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>

        <a data-th-href="@{/}" class="btn btn-secondary">
            Volver al inicio
        </a>

    </div>
</body>
</html>
