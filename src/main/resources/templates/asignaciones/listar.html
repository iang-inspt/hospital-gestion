<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Asignaciones médicas</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>
    <div class="container mt-5">

        <h1>Asignaciones médicas</h1>

        <div data-th-if="${mensaje}"
             class="alert alert-success"
             data-th-text="${mensaje}">
        </div>

        <div data-th-if="${error}"
             class="alert alert-danger"
             data-th-text="${error}">
        </div>

        <h3>Asignar médico a paciente</h3>

        <form data-th-action="@{/asignaciones/asignar}"
              method="post">

            <div class="mb-3">
                <label class="form-label">Paciente</label>

                <select name="pacienteId"
                        class="form-select" required>

                    <option value="">Seleccionar paciente</option>

                    <option data-th-each="paciente : ${pacientes}"
                            data-th-value="${paciente.id}"
                            data-th-text="${paciente.nombre + ' ' + paciente.apellido}">
                    </option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Médico</label>

                <select name="medicoId"
                        class="form-select" required>

                    <option value="">Seleccionar médico</option>

                    <option data-th-each="medico : ${medicos}"
                            data-th-value="${medico.id}"
                            data-th-text="${medico.nombre + ' ' + medico.apellido + ' - ' + medico.especialidad}">
                    </option>
                </select>
            </div>

            <button type="submit" class="btn btn-primary">
                Asignar médico
            </button>
        </form>

        <hr class="my-4">

        <h3>Asignaciones actuales</h3>

        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Paciente</th>
                    <th>Médico asignado</th>
                    <th>Acción</th>
                </tr>
            </thead>

            <tbody>
                <tr data-th-each="paciente : ${pacientes}">

                    <td data-th-text="${paciente.nombre + ' ' + paciente.apellido}">
                    </td>

                    <td data-th-text="${paciente.medico != null
                        ? paciente.medico.nombre + ' ' + paciente.medico.apellido
                        : 'Sin médico asignado'}">
                    </td>

                    <td>
                        <form data-th-if="${paciente.medico != null}"
                              data-th-action="@{/asignaciones/quitar/{id}(id=${paciente.id})}"
                              method="post">

                            <button type="submit"
                                    class="btn btn-danger btn-sm">
                                Quitar médico
                            </button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>

        <a data-th-href="@{/}"
           class="btn btn-secondary">
            Volver al inicio
        </a>

    </div>
</body>
</html>
