<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Camas</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body>
<div class="container mt-5">

    <h1>Gestión de Camas</h1>

    <div data-th-if="${mensaje}"
         class="alert alert-success"
         data-th-text="${mensaje}">
    </div>

    <div data-th-if="${error}"
         class="alert alert-danger"
         data-th-text="${error}">
    </div>

    <a data-th-href="@{/camas/nuevo}"
       class="btn btn-primary mb-3">
        Nueva cama
    </a>

    <table class="table table-striped">
        <thead>
            <tr>
                <th>ID</th>
                <th>Código</th>
                <th>Piso</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
        </thead>

        <tbody>
            <tr data-th-each="cama : ${camas}">

                <td data-th-text="${cama.id}"></td>
                <td data-th-text="${cama.codigo}"></td>
                <td data-th-text="${cama.piso}"></td>

                <td>
                    <span data-th-if="${cama.ocupada}"
                          class="badge bg-danger">
                        Ocupada
                    </span>

                    <span data-th-unless="${cama.ocupada}"
                          class="badge bg-success">
                        Libre
                    </span>
                </td>

                <td>
                    <a data-th-href="@{/camas/editar/{id}(id=${cama.id})}"
                       class="btn btn-warning btn-sm">
                        Editar
                    </a>

                    <form
                        data-th-action="@{/camas/eliminar/{id}(id=${cama.id})}"
                        method="post"
                        class="d-inline"
                        onsubmit="return confirm('¿Eliminar esta cama?');">

                        <button type="submit"
                                class="btn btn-danger btn-sm"
                                data-th-disabled="${cama.ocupada}">
                            Eliminar
                        </button>
                    </form>
                </td>

            </tr>
        </tbody>
    </table>

    <a data-th-href="@{/}"
       class="btn btn-secondary">
        Volver al inicio
    </a>

</div>
</body>
</html>
