<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Editar cama</title>

        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">
    </head>

    <body>
        <div class="container mt-5">

            <h1>Editar cama</h1>

            <div data-th-if="${error}"
                 class="alert alert-danger"
                 data-th-text="${error}">
            </div>

            <form data-th-action="@{/camas/actualizar/{id}(id=${cama.id})}"
                  data-th-object="${cama}"
                  method="post">

                <div class="mb-3">
                    <label for="codigo" class="form-label">
                        Código
                    </label>

                    <input type="text"
                           id="codigo"
                           data-th-field="*{codigo}"
                           class="form-control"
                           pattern="CAMA-[0-9]{3}"
                           maxlength="8"
                           required>
                </div>

                <div class="mb-3">
                    <label for="piso" class="form-label">
                        Piso
                    </label>

                    <input type="number"
                           id="piso"
                           data-th-field="*{piso}"
                           class="form-control"
                           min="0"
                           required>
                </div>

                <button type="submit" class="btn btn-primary">Guardar cambios</button>

                <a data-th-href="@{/camas}" class="btn btn-secondary">Cancelar</a>

            </form>

        </div>
    </body>
</html>
