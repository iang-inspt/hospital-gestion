<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registrar paciente</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

    <div class="container mt-5">

        <h1>Registrar nuevo paciente</h1>

        <div data-th-if="${error}"
             class="alert alert-danger"
             data-th-text="${error}">
        </div>

        <form data-th-action="@{/pacientes/guardar}"
              data-th-object="${paciente}"
              method="post">

            <div class="mb-3">
                <label for="dni" class="form-label">DNI</label>

                <input type="text"
                       id="dni"
                       data-th-field="*{dni}"
                       class="form-control"
                       required>
            </div>

            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre</label>

                <input type="text"
                       id="nombre"
                       data-th-field="*{nombre}"
                       class="form-control"
                       required>
            </div>

            <div class="mb-3">
                <label for="apellido" class="form-label">Apellido</label>

                <input type="text"
                       id="apellido"
                       data-th-field="*{apellido}"
                       class="form-control"
                       required>
            </div>

            <button type="submit" class="btn btn-primary">
                Guardar paciente
            </button>

            <a data-th-href="@{/pacientes}"
               class="btn btn-secondary">
                Cancelar
            </a>

        </form>

    </div>

</body>
</html>
