<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Reservas</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>
<div class="container mt-5">

    <h1>Gestión de Reservas</h1>

    <!-- Mensajes -->
    <div data-th-if="${mensaje}"
         class="alert alert-success"
         data-th-text="${mensaje}">
    </div>

    <div data-th-if="${error}"
         class="alert alert-danger"
         data-th-text="${error}">
    </div>

    <!-- FORMULARIO -->
    <h3 class="mt-4">Reservar cama</h3>

    <form data-th-action="@{/reservas/reservar}"
          method="post">

        <div class="mb-3">
            <label for="camaId" class="form-label">
                Cama disponible
            </label>

            <select id="camaId" name="camaId"
                    class="form-select" required>

                <option value="">Seleccionar cama</option>

                <option data-th-each="cama : ${camas}"
                        data-th-if="${!cama.ocupada}"
                        data-th-value="${cama.id}"
                        data-th-text="${cama.codigo + ' - Piso ' + cama.piso}">
                </option>

            </select>
        </div>

        <div class="mb-3">
            <label for="pacienteId" class="form-label">
                Paciente
            </label>

            <select id="pacienteId" name="pacienteId"
                    class="form-select" required>

                <option value="">Seleccionar paciente</option>

                <option data-th-each="paciente : ${pacientes}"
                        data-th-value="${paciente.id}"
                        data-th-text="${paciente.nombre + ' ' + paciente.apellido + ' - DNI: ' + paciente.dni}">
                </option>

            </select>
        </div>

        <button type="submit" class="btn btn-primary">
            Reservar cama
        </button>

    </form>

    <hr class="my-4">

    <!-- RESERVAS ACTIVAS -->
    <h3>Reservas activas</h3>

    <table class="table table-striped">
        <thead>
            <tr>
                <th>Cama</th>
                <th>Piso</th>
                <th>Paciente</th>
                <th>DNI</th>
                <th>Acciones</th>
            </tr>
        </thead>

        <tbody>
            <tr data-th-each="cama : ${camas}"
                data-th-if="${cama.ocupada}">

                <td data-th-text="${cama.codigo}"></td>

                <td data-th-text="${cama.piso}"></td>

                <td data-th-text="${cama.paciente.nombre + ' ' + cama.paciente.apellido}">
                </td>

                <td data-th-text="${cama.paciente.dni}"></td>

                <td>
                    <form data-th-action="@{/reservas/cancelar/{id}(id=${cama.id})}"
                          method="post"
                          onsubmit="return confirm('¿Cancelar esta reserva?');">

                        <button type="submit"
                                class="btn btn-danger btn-sm">
                            Cancelar reserva
                        </button>

                    </form>
                </td>
            </tr>
        </tbody>
    </table>

    <a data-th-href="@{/}"
       class="btn btn-secondary mt-3">
        Volver al inicio
    </a>

</div>
</body>
</html>
